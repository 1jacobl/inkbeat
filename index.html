<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16130f" />
    <link rel="apple-touch-icon" href="./icon-record.svg" />
    <link rel="icon" type="image/svg+xml" href="./icon-record.svg" />
    <title>Inkbeat — lyric pad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <script>
      try {
        if (JSON.parse(localStorage.getItem("inkbeat:prefs") || "{}").splash === false)
          document.documentElement.classList.add("no-splash");
      } catch (e) {}
    </script>
    <style>
      .no-splash #splash { display: none !important; }
      /* Startup splash: lives in the HTML so it shows before the app loads. */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center; align-content: center; gap: 18px;
        background: #f6d64a; cursor: pointer;
        animation: splash-out 0.6s cubic-bezier(0.7, 0, 0.3, 1) 2.15s forwards;
      }
      #splash svg { width: min(46vmin, 270px); height: auto; overflow: visible; }
      #splash .rec {
        transform-box: fill-box; transform-origin: center;
        animation: rec-in 0.75s cubic-bezier(0.3, 1.5, 0.5, 1) both;
      }
      #splash .spin {
        transform-box: view-box; transform-origin: 32px 27px;
        animation: spin 1.6s cubic-bezier(0.2, 0.7, 0.3, 1) both;
      }
      #splash .drip {
        transform-box: fill-box; transform-origin: top;
        animation: drip 0.6s cubic-bezier(0.5, 0, 0.3, 1.2) both;
      }
      #splash .d1 { animation-delay: 0.55s; }
      #splash .d2 { animation-delay: 0.7s; }
      #splash .d3 { animation-delay: 0.8s; }
      #splash .d4 { animation-delay: 0.9s; }
      #splash .drop {
        transform-box: fill-box; transform-origin: center;
        animation: drop 0.8s cubic-bezier(0.5, 0, 1, 0.6) 1.1s both;
      }
      #splash .word {
        font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800;
        font-size: clamp(34px, 7vmin, 56px); letter-spacing: -0.04em; color: #15120e;
        animation: word-in 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) 0.95s both;
      }
      #splash .tag {
        margin-top: -10px; font: 500 13px/1 "JetBrains Mono", ui-monospace, monospace; color: rgba(21, 18, 14, 0.6);
        animation: word-in 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) 1.15s both;
      }
      @keyframes rec-in { from { transform: scale(0.2); opacity: 0; } 40% { opacity: 1; } }
      @keyframes spin { from { transform: rotate(-540deg); } }
      @keyframes drip { from { transform: scaleY(0); } }
      @keyframes drop {
        0% { opacity: 0; transform: translateY(-6px); }
        20% { opacity: 1; }
        100% { opacity: 0; transform: translateY(40px) scaleY(1.3); }
      }
      @keyframes word-in { from { opacity: 0; transform: translateY(14px); } }
      @keyframes splash-out { to { transform: translateY(-100%); border-radius: 0 0 50% 50% / 0 0 18% 18%; } }
      #splash.skip { animation: splash-out 0.45s cubic-bezier(0.7, 0, 0.3, 1) forwards; }
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash * { animation: none !important; }
        #splash { transition: opacity 0.3s; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <g class="rec">
          <g fill="#15120e">
            <path class="drip d1" d="M20.6 40v9.5a3.6 3.6 0 0 0 7.2 0V43.5z" />
            <path class="drip d2" d="M33.2 44.5v3.2a2.9 2.9 0 0 0 5.8 0V42.5z" />
            <path class="drip d3" d="M42.4 39.5v2.6a2.4 2.4 0 0 0 4.8 0v-6z" />
            <path class="drip d4" d="M15 33.5v2.2a2.1 2.1 0 0 0 4.2 0v-1.5z" />
            <circle cx="32" cy="27" r="19.5" />
          </g>
          <g class="spin">
            <g fill="none" stroke="#3d342a" stroke-width="1.2">
              <circle cx="32" cy="27" r="16" /><circle cx="32" cy="27" r="12.8" /><circle cx="32" cy="27" r="9.8" />
            </g>
            <circle cx="32" cy="27" r="6.4" fill="#e8442c" />
            <path d="M28.2 24.6a4.4 4.4 0 0 1 4.6-2" stroke="#f6b3a6" stroke-width="1.2" stroke-linecap="round" fill="none" />
            <circle cx="32" cy="27" r="1.3" fill="#15120e" />
          </g>
          <path d="M19.5 19.5a14.5 14.5 0 0 1 8.5-6" stroke="#efe6d2" stroke-width="1.8" stroke-linecap="round" fill="none" opacity=".7" />
          <path d="M44.8 34a14.5 14.5 0 0 1-4.6 4.6" stroke="#efe6d2" stroke-width="1.4" stroke-linecap="round" fill="none" opacity=".35" />
        </g>
        <path class="drop" d="M36.1 53.2c1.3 1.4 1.6 2.8 1.6 3.6a1.6 1.6 0 0 1-3.2 0c0-.8.4-2.1 1.6-3.6z" fill="#15120e" />
      </svg>
      <div class="word">Inkbeat</div>
      <div class="tag">write · stamp · record</div>
    </div>
    <script>
      (function () {
        var s = document.getElementById("splash");
        if (!s) return;
        if (document.documentElement.classList.contains("no-splash")) {
          s.remove();
          return;
        }
        var gone = false;
        function done() {
          if (gone) return;
          gone = true;
          s.remove();
        }
        function skip() {
          if (s.classList.contains("skip")) return;
          s.classList.add("skip");
          setTimeout(done, 480);
        }
        s.addEventListener("click", skip);
        window.addEventListener("keydown", skip, { once: true });
        var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduce) {
          setTimeout(function () { s.style.opacity = "0"; }, 600);
          setTimeout(done, 950);
        } else {
          setTimeout(done, 2800);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
