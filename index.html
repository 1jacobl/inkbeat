<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15120e" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-nib.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Inkbeat" />
    <link rel="icon" type="image/svg+xml" href="./icon-nib.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon-nib.png" />
    <title>Inkbeat — lyric pad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <script>
      try {
        if (JSON.parse(localStorage.getItem("inkbeat:prefs") || "{}").splash === false)
          document.documentElement.classList.add("no-splash");
      } catch (e) {}
    </script>
    <style>
      .no-splash #splash { display: none !important; }
      /* Startup splash: lives in the HTML so it shows before the app loads. */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center; align-content: center; gap: 22px;
        background: #15120e; cursor: pointer;
        animation: splash-out 0.6s cubic-bezier(0.7, 0, 0.3, 1) 2.15s forwards;
      }
      #splash svg { width: min(16vmin, 84px); height: auto; overflow: visible; }
      #splash .nib { transform-box: fill-box; transform-origin: 50% 100%; animation: nib 0.7s cubic-bezier(0.3, 1.3, 0.5, 1) 0.05s both; }
      #splash .dot { transform-box: fill-box; transform-origin: center; animation: dot 0.7s cubic-bezier(0.3, 1.6, 0.5, 1) 0.45s both; }
      #splash .word {
        font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800;
        font-size: clamp(34px, 7vmin, 56px); letter-spacing: -0.045em; color: #efe6d2;
        animation: word-in 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) 0.85s both;
      }
      #splash .word i { display: inline-block; width: 0.22em; height: 0.22em; margin-left: 0.08em; border-radius: 50%; background: #e8442c; }
      #splash .tag {
        margin-top: -12px; font: 500 12px/1 "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.12em; text-transform: uppercase; color: #9c907b;
        animation: word-in 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) 1.05s both;
      }
      @keyframes nib { from { transform: translateY(-30px) rotate(-20deg); opacity: 0; } 40% { opacity: 1; } }
      @keyframes dot { from { transform: scale(0); } }
      @keyframes word-in { from { opacity: 0; transform: translateY(14px); } }
      @keyframes splash-out { to { transform: translateY(-100%); border-radius: 0 0 50% 50% / 0 0 18% 18%; } }
      #splash.skip { animation: splash-out 0.45s cubic-bezier(0.7, 0, 0.3, 1) forwards; }
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash * { animation: none !important; }
        #splash { transition: opacity 0.3s; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="16 10 32 48" xmlns="http://www.w3.org/2000/svg"><defs><filter id="ink" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.45" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="0.9"/></filter></defs><g filter="url(#ink)"><g class="nib"><path d="M32 56C29.2 50 21.6 41.5 20.4 33.5C19.8 29.2 21.6 25.2 24.6 22.8L25 13.5H39L39.4 22.8C42.4 25.2 44.2 29.2 43.6 33.5C42.4 41.5 34.8 50 32 56Z" fill="#efe6d2"/><path d="M25 17.6H39" stroke="#15120e" stroke-width="1.3"/><path d="M32 55V34.5" stroke="#15120e" stroke-width="1.6" stroke-linecap="round"/><circle class="dot" cx="32" cy="30.5" r="4.6" fill="#e8442c"/></g></g></svg>
      <div class="word">Inkbeat</div>
      <div class="tag">write · stamp · record</div>
    </div>
    <script>
      (function () {
        var s = document.getElementById("splash");
        if (!s) return;
        if (document.documentElement.classList.contains("no-splash")) {
          s.remove();
          return;
        }
        var gone = false;
        function done() {
          if (gone) return;
          gone = true;
          s.remove();
        }
        function skip() {
          if (s.classList.contains("skip")) return;
          s.classList.add("skip");
          setTimeout(done, 480);
        }
        s.addEventListener("click", skip);
        window.addEventListener("keydown", skip, { once: true });
        var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduce) {
          setTimeout(function () { s.style.opacity = "0"; }, 600);
          setTimeout(done, 950);
        } else {
          setTimeout(done, 2800);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
